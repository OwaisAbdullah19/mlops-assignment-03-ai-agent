name: lint-and-test
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --junitxml=evidence/ci-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: evidence/ci-tests.xml
