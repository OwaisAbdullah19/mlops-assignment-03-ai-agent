[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "assignment-03-mlops-agent"
version = "1.0.0"
description = "Evidence-based MLOps tool-calling agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.3", "pydantic==2.11.7",
  "httpx==0.28.1", "PyYAML==6.0.2", "numpy==2.2.6",
  "pandas==2.2.3", "scikit-learn==1.6.1", "joblib==1.5.1",
  "mlflow==3.1.4", "dvc==3.63.0", "kubernetes==33.1.0", "pathspec==0.12.1",
  "SQLAlchemy==2.0.41",
]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "ruff==0.12.9"]

[project.scripts]
mlops-agent = "agent.main:main"

[tool.setuptools.packages.find]
include = ["agent*", "api*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
exclude = [".tools", ".venv", ".runtime", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
