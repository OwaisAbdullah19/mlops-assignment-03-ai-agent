apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlops-agent
  namespace: mlops-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlops-observer
  namespace: mlops-agent
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["iris-api"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlops-observer
  namespace: mlops-agent
subjects:
  - kind: ServiceAccount
    name: mlops-agent
    namespace: mlops-agent
roleRef:
  kind: Role
  name: mlops-observer
  apiGroup: rbac.authorization.k8s.io
